<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="container">
    <h1>Login</h1>

    <form action="{% url 'social:begin' 'google-oauth2' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="google-btn">
            Login with Google
        </button><br>
        <a href="/register">registration</a>
    </form>

</div>

</body>
</html>
