<!DOCTYPE html>
<html>
<head>

    <title>Registration Success</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #43cea2,
                #185a9d
            );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .container {

            width: 420px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            text-align: center;

            box-shadow: 0 10px 30px rgba(0,0,0,0.2);

        }


        h2 {

            color: green;

            margin-bottom: 20px;

        }


        p {

            margin: 15px 0;

            font-size: 17px;

            color: #333;

        }


        .email {

            color: #185a9d;

            font-weight: bold;

        }


        a {

            display: inline-block;

            margin-top: 20px;

            padding: 10px 20px;

            background: #185a9d;

            color: white;

            text-decoration: none;

            border-radius: 8px;

        }


        a:hover {

            background: #0f3d6b;

        }


    </style>

</head>


<body>


<div class="container">


    <h2>
        Registration Successful 🎉
    </h2>


    <p>
        Hello 
        <strong>{{ user.username }}</strong>
    </p>


    <p>
        Your account has been created successfully.
    </p>


    <p>
        Welcome email sent to:
        <br>
        <span class="email">
            {{ user.email }}
        </span>
    </p>


    <a href="/register/">Register Another User</a>


</div>


</body>
</html>
