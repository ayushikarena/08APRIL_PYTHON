<!-- navbar.html -->
<header class="sticky-top">
    <nav class="navbar navbar-expand-lg navbar-custom py-3" aria-label="Main Navigation">
        <div class="container">
            <!-- Brand Logo & Name -->
            <a class="navbar-brand d-flex align-items-center me-4" href="{% url 'home' %}">
                <i class="bi bi-shop-window text-primary me-2 fs-2"></i>
                <span class="gradient-text">FoodieFinder</span>
            </a>

            <!-- Mobile Navbar Toggler -->
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
                <i class="bi bi-list fs-2 text-primary"></i>
            </button>

            <!-- Navigation Links -->
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-semibold">
                    <li class="nav-item">
                        <a class="nav-link px-3" href="{% url 'home' %}"><i class="bi bi-house-door me-1"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="{% url 'restaurant_search' %}"><i class="bi bi-search me-1"></i> Restaurants</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="{% url 'map' %}"><i class="bi bi-geo-alt me-1"></i> Google Maps</a>
                    </li>
                </ul>

                <!-- Right Side Actions: Icon-Only Theme Switcher Buttons & Auth -->
                <div class="d-flex align-items-center gap-2">
                    
                    <!-- BUTTON 1: Icon-Only Light & Black Background Mode Toggle -->
                    <button id="bg-toggle-btn" class="btn btn-bg-toggle shadow-sm" type="button" title="Toggle Light / Black Background">
                        <i id="bg-mode-icon" class="bi bi-sun-fill text-warning fs-5"></i>
                    </button>

                    <!-- BUTTON 2: Icon-Only Color Accent Palette Switcher -->
                    <button id="palette-toggle-btn" class="btn btn-palette-toggle shadow-sm" type="button" title="Cycle Color Theme Accents">
                        <i id="palette-btn-icon" class="bi bi-palette-fill fs-5"></i>
                    </button>

                    {% if user.is_authenticated %}
                        <a class="btn btn-sm btn-outline-primary rounded-pill px-3 fw-bold ms-2" href="{% url 'dashboard' %}">
                            <i class="bi bi-speedometer2 me-1"></i> Dashboard
                        </a>
                        <a class="nav-link fw-semibold px-2" href="{% url 'profile' %}">
                            <i class="bi bi-person-circle me-1 text-primary"></i> {{ user.first_name|default:user.username }}
                        </a>
                        <a class="btn btn-danger btn-sm rounded-pill px-3 fw-bold" href="{% url 'logout' %}">
                            <i class="bi bi-box-arrow-right me-1"></i> Logout
                        </a>
                    {% else %}
                        <a class="nav-link fw-semibold ms-2" href="{% url 'login' %}">Log In</a>
                        <a class="btn btn-primary-gradient btn-sm rounded-pill px-4" href="{% url 'register' %}">
                            <i class="bi bi-person-plus me-1"></i> Get Started
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
</header>
