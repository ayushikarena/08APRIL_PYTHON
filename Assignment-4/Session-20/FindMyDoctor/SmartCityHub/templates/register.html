{% extends 'base.html' %}
{% block title %}Register - {{ PROJECT_NAME }}{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center animate-fade-up my-5" style="min-height: 80vh;">
    <div class="glass-panel p-5 border-0 shadow-lg" style="max-width: 500px; width: 100%;">
        <div class="text-center mb-5">
            <div class="bg-primary-custom text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow" style="width: 64px; height: 64px;">
                <i class="bi bi-person-plus fs-2"></i>
            </div>
            <h2 class="fw-bolder">Create Account</h2>
            <p class="text-muted small fw-medium">Join {{ PROJECT_NAME }} today</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label fw-semibold small text-muted">Username</label>
                    <input type="text" name="username" class="form-control form-control-glass" placeholder="johndoe" required>
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label fw-semibold small text-muted">Email Address</label>
                    <input type="email" name="email" class="form-control form-control-glass" placeholder="john@example.com" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label fw-semibold small text-muted">Password</label>
                    <input type="password" name="password" class="form-control form-control-glass" placeholder="••••••••" required>
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label fw-semibold small text-muted">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control form-control-glass" placeholder="••••••••" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary-custom w-100 rounded-pill py-3 fw-bold mb-4 shadow-sm hover-lift">
                Create Account
            </button>
        </form>
        
        <div class="text-center">
            <p class="text-muted small mb-0 fw-medium">Already have an account? <a href="{% url 'login' %}" class="text-primary fw-bold text-decoration-none">Sign in</a></p>
        </div>
    </div>
</div>
{% endblock %}
