{% extends 'base.html' %}
{% block title %}Verify OTP - {{ PROJECT_NAME }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5 text-center">
                    <div class="mb-4 text-primary">
                        <i class="bi bi-shield-lock display-4"></i>
                    </div>
                    <h3 class="card-title mb-3 fw-bold">Verify OTP</h3>
                    <p class="text-muted mb-4">Please enter the 6-digit OTP sent to your email.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-4">
                            <input type="text" name="otp" class="form-control form-control-lg text-center fw-bold" placeholder="• • • • • •" maxlength="6" required>
                        </div>
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill">Verify & Login</button>
                        </div>
                    </form>
                    <form method="post" action="{% url 'resend_otp' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link text-decoration-none">Resend OTP</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
